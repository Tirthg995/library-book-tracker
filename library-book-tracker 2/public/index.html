<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        body>p {
            text-align: center;
            color: #666;
            margin-top: 0;
        }

        .form-box {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        .book {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .stats>div {
            background: white;
            padding: 15px;
            border-radius: 10px;
            flex: 1;
            text-align: center;
        }

        .stats h3 {
            margin-bottom: 5px;
        }

        .stats p {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }

        .available {
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

    <h1>📚 Library Book Tracker</h1>
    <p>Manage books, availability and circulation.</p>

    <div class="form-box">
        <h2>Add a Book</h2>

        <form id="bookForm">
            <input type="text" id="title" placeholder="Book title" required>

            <input type="text" id="author" placeholder="Author" required>

            <input type="number" id="total" placeholder="Total copies" min="1" required>

            <button type="submit">Add Book</button>
        </form>
    </div>

    <input type="text" id="searchInput" placeholder="Search by title or author..." />

    <div class="stats">
        <div>
            <h3>Total Books</h3>
            <p id="totalBooks">0</p>
        </div>

        <div>
            <h3>Total Copies</h3>
            <p id="totalCopies">0</p>
        </div>

        <div>
            <h3>Available Copies</h3>
            <p id="availableCopies">0</p>
        </div>
    </div>

    <h2>Books</h2>

    <div id="books"></div>

    <footer>
        Running commit: <strong>__COMMIT__</strong>
    </footer>

    <script>
        async function loadBooks() {
            const response = await fetch('/api/books');
            const books = await response.json();

            document.getElementById('totalBooks').textContent = books.length;

            const totalCopies = books.reduce(
                (sum, book) => sum + book.total,
                0
            );

            const availableCopies = books.reduce(
                (sum, book) => sum + book.available,
                0
            );

            document.getElementById('totalCopies').textContent = totalCopies;
            document.getElementById('availableCopies').textContent = availableCopies;

            const searchText = document
                .getElementById('searchInput')
                .value
                .toLowerCase();

            const filteredBooks = books.filter((book) =>
                book.title.toLowerCase().includes(searchText) ||
                book.author.toLowerCase().includes(searchText)
            );

            const container = document.getElementById('books');

            container.innerHTML = '';

            filteredBooks.forEach((book) => {
                const div = document.createElement('div');

                div.className = 'book';

                div.innerHTML = `
                <h3>${book.title}</h3>
                <p>Author: ${book.author}</p>
                <p class="available">
                    Available: ${book.available} / ${book.total}
                </p>

                <button onclick="issueBook(${book.id})">
                    Issue
                </button>

                <button onclick="returnBook(${book.id})">
                    Return
                </button>
                `;

                container.appendChild(div);
            });
        }

        document
            .getElementById('searchInput')
            .addEventListener('input', loadBooks);

        async function issueBook(id) {
            const response = await fetch(`/api/books/${id}/issue`, {
                method: 'POST'
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.error);
                return;
            }

            loadBooks();
        }

        async function returnBook(id) {
            const response = await fetch(`/api/books/${id}/return`, {
                method: 'POST'
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.error);
                return;
            }

            loadBooks();
        }

        document
            .getElementById('bookForm')
            .addEventListener('submit', async (event) => {
                event.preventDefault();

                const title = document.getElementById('title').value;
                const author = document.getElementById('author').value;
                const total = document.getElementById('total').value;

                const response = await fetch('/api/books', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title,
                        author,
                        total
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error);
                    return;
                }

                document.getElementById('bookForm').reset();

                loadBooks();
            });

        loadBooks();
    </script>

</body>

</html>
