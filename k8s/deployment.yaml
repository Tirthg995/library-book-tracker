apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-book-tracker
  labels:
    app: library-book-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-book-tracker
  template:
    metadata:
      labels:
        app: library-book-tracker
    spec:
      containers:
        - name: library-book-tracker
          # Jenkins overrides this tag on every run with `kubectl set image`.
          # Replace <your-dockerhub-username> with your Docker Hub username.
          image: <your-dockerhub-username>/library-book-tracker:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
